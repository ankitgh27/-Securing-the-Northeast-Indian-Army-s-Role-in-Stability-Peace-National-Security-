    function padPage(n) {
      return String(n).padStart(2, "0");
    }

    function createSheet(pageNum, pillarLabel, innerHtml, extraClass = "") {
      const isCover = extraClass.includes("cover-page");
      const isDivider = extraClass.includes("section-divider");
      const headerHtml = isCover ? "" : `
        <div class="running-header">
          <span>SENTINEL OF THE DAWN-LIT MOUNTAINS &bull; OCT 2026</span>
          <span class="pillar-tag">${pillarLabel}</span>
        </div>
      `;
      const footerHtml = isCover ? "" : `
        <div class="running-footer">
          <span>SECURING THE NORTHEAST: STABILITY, PEACE &amp; NATIONAL SECURITY (POST 01 SEP 2026)</span>
          <span class="folio-badge">PAGE ${padPage(pageNum)} OF 50</span>
        </div>
      `;
      return `
        <section id="page-${padPage(pageNum)}" class="a4-page ${extraClass}" data-page="${pageNum}" data-title="Page ${padPage(pageNum)} — ${pillarLabel}">
          ${headerHtml}
          <div class="page-body">
            ${innerHtml}
          </div>
          ${footerHtml}
        </section>
      `;
    }

          <h2 class="article-headline">Guardians of the Eight Sisters: Why Security and Empathy Are Indivisible in Northeast India</h2>
          <p class="article-subdeck">Synthesizing 30 days of high-altitude deterrence, counter-insurgency vigilance, frontier engineering, and youth empowerment across India's Eastern Theater (01 September – 03 October 2026).</p>
          <div class="two-col-body">
            <p class="drop-cap">Across the eight states of Northeast India—Arunachal Pradesh, Assam, Manipur, Meghalaya, Mizoram, Nagaland, Sikkim, and Tripura—national security has never been a purely kinetic enterprise. Bounded by 5,484 kilometers of international borders shared with China along the Line of Actual Control (LAC), Myanmar, Bangladesh, Bhutan, and Nepal, this theater demands an extraordinary dual doctrine from the Indian Army, the Assam Rifles, and the Border Roads Organisation (BRO).</p>
            <p>On the external frontier, formations under Eastern Command—Trishakti Corps in Sikkim, Gajraj Corps in western Arunachal Pradesh, and Spear Corps across eastern Arunachal and the Indo-Myanmar border—must maintain round-the-clock technological and logistical overmatch at altitudes exceeding 15,000 feet. During September 2026 alone, this imperative drove the induction of 45 BonV Aero heavy-payload logistics UAVs (September 28) and the first railway rake of Indian Oil’s minus-33°C Xtreme Weather Grade diesel for Sikkim and Arunachal Pradesh (September 26).</p>
            <p>Simultaneously, along the 1,643-kilometer Indo-Myanmar border and within sensitive hinterland valleys, soldiers confront the intertwined challenges of insurgent ambushes, weapons caching, and transnational narco-terrorism. The supreme sacrifice of Havildar Jangkhokai Kuki of 21 Assam Rifles on September 29 in Changlang while protecting border fencing construction stands as a solemn reminder of the price paid for frontier stability.</p>
